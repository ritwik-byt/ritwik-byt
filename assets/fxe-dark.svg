<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220" role="img" aria-label="Multi-Currency Live FX Ingestion Engine">
<style>
@keyframes sweep{0%{transform:translateX(-140px)}60%,100%{transform:translateX(740px)}}
@keyframes live{0%,100%{opacity:1}50%{opacity:.35}}
.sweep{animation:sweep 6s ease-in-out infinite}
.live{animation:live 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="shine_fxe" x1="0" x2="1"><stop offset="0" stop-color="#0084ff" stop-opacity="0"/><stop offset=".5" stop-color="#0084ff" stop-opacity=".06"/><stop offset="1" stop-color="#0084ff" stop-opacity="0"/></linearGradient>
<clipPath id="c_fxe"><rect x="1" y="1" width="598" height="218" rx="16"/></clipPath>
</defs>
<g clip-path="url(#c_fxe)">
<rect width="600" height="220" fill="#0f1523"/>
<rect class="sweep" x="0" y="0" width="140" height="220" fill="url(#shine_fxe)"/>
<rect x="28" y="0" width="70" height="2" fill="#0084ff"/>
</g>
<rect x="0.5" y="0.5" width="599" height="219" rx="16" fill="none" stroke="#1c2842"/>
<text x="28" y="44" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif" font-size="23" font-weight="400" letter-spacing="-0.3" fill="#f0f5ff">Multi-Currency Live FX Ingestion Engine</text>
<rect x="480" y="24" width="92" height="26" rx="13" fill="none" stroke="#1c2842"/>
<circle class="live" cx="494" cy="37" r="3" fill="#4b5e82"/>
<text x="504" y="41.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#9eb4dc">Pipeline</text>
<text x="28" y="65" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#0084ff">Direct Injection: Real-Time Currency Normalization</text>
<text y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9eb4dc"><tspan x="28" dy="0">Automated REST API service polling live global foreign exchange rates,</tspan><tspan x="28" dy="20">partitioning currency snapshots into S3 Bronze storage for Lakehouse</tspan><tspan x="28" dy="20">multi-currency conversion across 560K+ international transactions.</tspan></text>
